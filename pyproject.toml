[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-knowledge-lab"
version = "0.1.0"
description = "An independently reproducible hybrid-retrieval RAG demonstration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "scikit-learn>=1.4,<2",
  "rank-bm25>=0.2.2,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
neural = ["sentence-transformers>=3,<6"]

[project.scripts]
rag-lab = "rag_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_lab = ["static/*", "data/docs/*.md", "data/eval.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
