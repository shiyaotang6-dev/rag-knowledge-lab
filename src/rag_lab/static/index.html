<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG Knowledge Lab</title>
  <style>
    :root { color-scheme: dark; --bg:#111418; --panel:#191e25; --line:#2c3642; --text:#edf2f7; --muted:#9da9b7; --accent:#79b8ff; --good:#79d5ad; }
    * { box-sizing:border-box; } body { margin:0; background:radial-gradient(circle at 70% -20%, #25354b 0, transparent 45%),var(--bg); color:var(--text); font:15px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
    main { width:min(1080px,calc(100% - 36px)); margin:0 auto; padding:48px 0 72px; } header { display:flex; justify-content:space-between; gap:24px; align-items:end; border-bottom:1px solid var(--line); padding-bottom:24px; } h1 { margin:0; font-size:clamp(28px,5vw,46px); letter-spacing:-.04em; } h1 span { color:var(--accent); } .eyebrow { color:var(--good); text-transform:uppercase; letter-spacing:.16em; font-size:11px; font-weight:700; } .sub { max-width:650px; color:var(--muted); margin:12px 0 0; } .badge { border:1px solid #36506a; border-radius:999px; color:var(--accent); padding:8px 12px; white-space:nowrap; font-size:12px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:24px; } .card { background:color-mix(in srgb,var(--panel) 90%,transparent); border:1px solid var(--line); border-radius:14px; padding:20px; } .wide { grid-column:1/-1; } label { display:block; color:var(--muted); font-size:12px; margin-bottom:7px; } textarea { width:100%; resize:vertical; min-height:94px; background:#0e1115; border:1px solid var(--line); border-radius:10px; padding:12px; color:var(--text); font:inherit; } .controls { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; } select,button { background:#212b37; border:1px solid #405267; border-radius:8px; color:var(--text); padding:9px 12px; font:inherit; } button { cursor:pointer; background:var(--accent); color:#08111a; border:0; font-weight:700; } button:disabled { opacity:.6; cursor:wait; } .small { color:var(--muted); font-size:12px; } #status { min-height:22px; margin-top:14px; color:var(--muted); } #answer { white-space:pre-wrap; font-size:17px; min-height:70px; } .evidence { border-top:1px solid var(--line); margin-top:16px; padding-top:14px; } .evidence h3 { margin:0 0 8px; font-size:13px; color:var(--accent); } .quote { color:#cbd5e1; background:#10151b; border-left:3px solid #557da6; padding:10px 12px; border-radius:0 8px 8px 0; } dl { display:grid; grid-template-columns:120px 1fr; gap:5px 14px; margin:0; } dt { color:var(--muted); } dd { margin:0; text-align:right; } .docs { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; } .doc { padding:10px; border:1px solid var(--line); border-radius:8px; color:var(--muted); font-size:12px; } .doc b { display:block; color:var(--text); margin-bottom:4px; font-size:13px; }
    @media(max-width:720px){ main{padding-top:28px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.docs{grid-template-columns:1fr 1fr} header{display:block}.badge{display:inline-block;margin-top:18px} }
  </style>
</head>
<body><main>
  <header><div><div class="eyebrow">Personal reproducible demo · offline first</div><h1>RAG <span>Knowledge Lab</span></h1><p class="sub">混合检索、可解释证据和拒答策略的轻量演示。示例资料全部虚构；本页面不代表任何公司内部系统。</p></div><div class="badge" id="health">正在加载索引…</div></header>
  <section class="grid">
    <div class="card wide"><label for="question">试着提问</label><textarea id="question">发现账号被盗时，我应该先做什么？</textarea><div class="controls"><select id="mode" aria-label="回答方式"><option value="offline">本地证据模式（无需 API）</option><option value="deepseek" disabled>兼容 API 生成（未配置）</option></select><button id="ask">检索并回答</button></div><div id="status" role="status"></div></div>
    <div class="card"><div class="eyebrow">Answer</div><div id="answer">答案会显示在这里。</div><div id="timing" class="small"></div></div>
    <div class="card"><div class="eyebrow">Retrieval pipeline</div><dl><dt>关键词</dt><dd>BM25</dd><dt>向量</dt><dd id="embedding-name">TF-IDF cosine</dd><dt>融合</dt><dd>RRF</dd><dt>重排</dt><dd id="reranker-name">句子覆盖基线</dd><dt>拒答</dt><dd>证据阈值 + 引用</dd></dl></div>
    <div class="card wide"><div class="eyebrow">Cited evidence</div><div id="evidence" class="evidence"><span class="small">提交问题后显示答案实际使用的来源。</span></div></div>
    <div class="card wide"><div class="eyebrow">Sample corpus</div><div id="docs" class="docs"></div></div>
  </section>
</main><script>
const $=s=>document.querySelector(s); const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){ try { const h=await fetch('/api/health').then(r=>r.json()); $('#health').textContent=`${h.documents} docs · ${h.chunks} chunks`; $('#embedding-name').textContent=h.embedding; $('#reranker-name').textContent=h.reranker; const api=$('#mode option[value="deepseek"]'); api.disabled=!h.api_available; api.textContent=h.api_available?'兼容 API 生成（已配置）':'兼容 API 生成（未配置）'; const d=await fetch('/api/documents').then(r=>r.json()); $('#docs').innerHTML=d.map(x=>`<div class="doc"><b>${esc(x.title)}</b>${esc(x.source)}</div>`).join(''); } catch(e){ $('#health').textContent='服务未连接'; } }
async function ask(){ const btn=$('#ask'); btn.disabled=true; $('#status').textContent='检索中…'; $('#answer').textContent=''; $('#evidence').innerHTML=''; $('#timing').textContent=''; try { const response=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:$('#question').value,mode:$('#mode').value,top_k:3})}); const data=await response.json(); if(!response.ok) throw new Error(typeof data.detail==='string'?data.detail:'请求无效，请检查问题内容。'); $('#answer').textContent=data.answer; $('#timing').textContent=`${data.supported?'已找到支持证据':'已触发拒答'} · retrieval ${data.timings.retrieval_ms} ms · mode ${data.mode}`; $('#status').textContent=data.supported?'回答附带可追溯引用。':'证据不足，系统选择拒答。'; $('#evidence').innerHTML=(data.evidence||[]).map(e=>`<article><h3>${esc(e.citation)} · ${esc(e.source)}</h3><div class="quote">${esc(e.excerpt||e.text)}</div></article>`).join('')||'<span class="small">没有可引用证据。</span>'; } catch(e){ $('#status').textContent=e.message; } finally { btn.disabled=false; } }
$('#ask').addEventListener('click',ask); load();
</script></body></html>
